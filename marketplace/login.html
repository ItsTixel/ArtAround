<!DOCTYPE html>
<html lang="it">
<head>
    <script>(function(){var t=localStorage.getItem('artaround-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
    <title>ArtAround — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/marketplace/css/base.css">
    <link rel="stylesheet" href="/marketplace/css/auth.css">

    <!-- Tailwind: CSS precompilato dalla CLI (`npm run build:css`), al posto
         di cdn.tailwindcss.com. Ultimo foglio, come la CDN che iniettava
         i suoi stili a fine <head>. Config: /tailwind.config.js -->
    <link rel="stylesheet" href="/marketplace/css/tailwind.css">

    <script type="module" src="/marketplace/components/app-navbar.js"></script>
    <script type="module" src="/marketplace/components/app-footer.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <app-navbar></app-navbar>

    <main id="main-content">
        <section class="auth-hero">
            <div class="auth-card">
                <div class="kicker">Marketplace</div>
                <h1>Accedi</h1>
                <p class="auth-sub">Bentornato su ArtAround</p>

                <form id="loginForm" class="auth-form">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder="es: autore1@example.com" aria-describedby="feedbackMessage">
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="es: 12345678" aria-describedby="feedbackMessage">
                    </div>
                    <button type="submit" class="btn-primary">Entra</button>
                </form>

                <div class="auth-divider">oppure</div>
                <div class="google-btn-wrap" id="google-signin-btn"></div>

                <p id="feedbackMessage" class="feedback" role="alert"></p>

                <p class="auth-switch">
                    Non hai un account? <a id="switchLink" href="/marketplace/register.html">Registrati</a>
                </p>
            </div>
        </section>
    </main>

    <app-footer></app-footer>

    <script src="/marketplace/js/login.js"></script>
</body>
</html>
