<!DOCTYPE html>
<html lang="it">
<head>
  <script>(function(){var t=localStorage.getItem('artaround-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <title>ArtAround — Scopri le visite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/marketplace/css/base.css">
  <link rel="stylesheet" href="/marketplace/css/visits.css">

  <!-- Tailwind: CSS precompilato dalla CLI (`npm run build:css`), al posto
       di cdn.tailwindcss.com. Ultimo foglio, come la CDN che iniettava
       i suoi stili a fine <head>. Config: /tailwind.config.js -->
  <link rel="stylesheet" href="/marketplace/css/tailwind.css">

  <script type="module" src="/marketplace/components/app-navbar.js"></script>
  <script type="module" src="/marketplace/components/app-footer.js"></script>
  <script type="module" src="/marketplace/components/filter-sidebar.js"></script>
  <script type="module" src="/marketplace/components/visit-card.js"></script>
  <script type="module" src="/marketplace/components/visit-modal.js"></script>
</head>
<body>

  <app-navbar></app-navbar>

  <main id="main-content">
    <section class="page-hero" aria-label="Visite disponibili">
      <div class="hero-slideshow" data-interval="6000" aria-hidden="true">
        <img src="/marketplace/assets/visits/img1.png" class="is-active" alt="">
        <img src="/marketplace/assets/visits/img2.png" alt="">
        <img src="/marketplace/assets/visits/img3.png" alt="">
        <img src="/marketplace/assets/visits/img4.png" alt="">
        <img src="/marketplace/assets/visits/img5.png" alt="">
        <img src="/marketplace/assets/visits/img6.png" alt="">
        <img src="/marketplace/assets/visits/img7.png" alt="">
      </div>
      <div class="page-hero-inner">
        <h1>Scopri le visite</h1>
      </div>
    </section>

    <div class="visits-layout">
      <filter-sidebar></filter-sidebar>

      <section class="visits-content" aria-label="Lista visite">
        <div class="results-bar">
          <span class="results-count" id="results-count" aria-live="polite">— visite</span>

          <div class="results-controls">
            <label class="visit-search" aria-label="Cerca tra le visite">
              <input id="search-visit" type="search" placeholder="Cerca una visita…" autocomplete="off">
            </label>
            <label for="sort">Ordina</label>
            <select id="sort" aria-label="Ordina le visite">
              <option value="recommended">Consigliato</option>
              <option value="title">Titolo A→Z</option>
              <option value="-title">Titolo Z→A</option>
              <option value="duration-asc">Durata crescente</option>
              <option value="duration-desc">Durata decrescente</option>
              <option value="price-asc">Prezzo crescente</option>
              <option value="price-desc">Prezzo decrescente</option>
            </select>
          </div>
        </div>

        <div class="visits-grid" id="visits-grid" role="list" aria-label="Visite disponibili"></div>
        <nav class="pagination" id="pagination" aria-label="Navigazione pagine"></nav>
      </section>
    </div>
  </main>

  <app-footer></app-footer>

  <visit-modal></visit-modal>

  <script src="/marketplace/js/hero-slideshow.js"></script>
  <script type="module" src="/marketplace/js/visits.js"></script>
</body>
</html>
