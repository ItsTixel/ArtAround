<!DOCTYPE html>
<html lang="it">
<head>
  <script>(function(){var t=localStorage.getItem('artaround-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <title>ArtAround — Scopri i Musei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Nunito+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/marketplace/css/base.css">
  <link rel="stylesheet" href="/marketplace/css/museums.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'] };</script>

  <script type="module" src="/marketplace/components/app-navbar.js"></script>
  <script type="module" src="/marketplace/components/app-footer.js"></script>
  <script type="module" src="/marketplace/components/museum-card.js"></script>
  <script type="module" src="/marketplace/components/museum-modal.js"></script>
</head>
<body>

  <app-navbar></app-navbar>

  <main id="main-content">
    <section class="page-hero" aria-label="Musei disponibili">
      <div class="hero-slideshow" data-interval="6000" aria-hidden="true">
        <img src="/marketplace/assets/museums/img1.png" class="is-active" alt="">
        <img src="/marketplace/assets/museums/img2.png" alt="">
        <img src="/marketplace/assets/museums/img3.png" alt="">
        <img src="/marketplace/assets/museums/img4.png" alt="">
        <img src="/marketplace/assets/museums/img5.png" alt="">
        <img src="/marketplace/assets/museums/img6.png" alt="">
        <img src="/marketplace/assets/museums/img7.png" alt="">
      </div>
      <div class="page-hero-inner">
        <h1>Scopri i Musei</h1>
      </div>
    </section>

    <section class="search-section" aria-label="Ricerca e filtri">
      <div class="search-bar">
        <input
          type="search"
          id="search-input"
          placeholder="Cerca museo per nome…"
          aria-label="Cerca museo per nome"
          autocomplete="off"
        >
      </div>
      <div class="filters">
        <select id="city-filter" aria-label="Filtra per città">
          <option value="">Tutte le città</option>
        </select>
        <select id="sort-select" aria-label="Ordina per">
          <option value="name">Nome A→Z</option>
          <option value="-name">Nome Z→A</option>
          <option value="address.city">Città A→Z</option>
          <option value="-address.city">Città Z→A</option>
        </select>
        <label class="filter-toggle">
          <input type="checkbox" id="accessible-filter" aria-label="Mostra solo musei accessibili">
          Solo musei accessibili
        </label>
      </div>
      <a class="all-visits-link" href="/marketplace/pages/visits.html" title="Vedi tutte le visite senza selezionare un museo">
        Tutte le visite →
      </a>
    </section>

    <div class="museums-container">
      <div class="results-header">
        <span class="results-count" id="results-count" aria-live="polite"></span>
      </div>
      <div class="museums-grid" id="museums-grid" role="list" aria-label="Lista musei"></div>
      <nav class="pagination" id="pagination" aria-label="Navigazione pagine"></nav>
    </div>
  </main>

  <app-footer></app-footer>

  <museum-modal></museum-modal>

  <script src="/marketplace/js/hero-slideshow.js"></script>
  <script src="/marketplace/js/museums.js"></script>
</body>
</html>
