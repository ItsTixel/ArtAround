<!DOCTYPE html>
<html lang="it">
<head>
  <script>(function(){var t=localStorage.getItem('artaround-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
  <title>ArtAround — Scopri le opere</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Nunito+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/marketplace/css/base.css">
  <link rel="stylesheet" href="/marketplace/css/visits.css">
  <link rel="stylesheet" href="/marketplace/css/auth.css">
  <link rel="stylesheet" href="/marketplace/css/create-content.css">
  <link rel="stylesheet" href="/marketplace/css/create-item.css">
  <link rel="stylesheet" href="/marketplace/css/create-entity.css">
  <link rel="stylesheet" href="/marketplace/css/opere.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'] };</script>

  <script type="module" src="/marketplace/components/app-navbar.js"></script>
  <script type="module" src="/marketplace/components/app-footer.js"></script>
  <script type="module" src="/marketplace/components/entity-filter-sidebar.js"></script>
  <script type="module" src="/marketplace/components/opera-card.js"></script>
  <script type="module" src="/marketplace/components/opera-modal.js"></script>
</head>
<body>

  <app-navbar></app-navbar>

  <main id="main-content">
    <section class="page-hero" aria-label="Opere disponibili">
      <div class="hero-slideshow" data-interval="6000" aria-hidden="true">
        <img src="/marketplace/assets/items/img1.png" class="is-active" alt="">
        <img src="/marketplace/assets/items/img2.png" alt="">
        <img src="/marketplace/assets/items/img3.png" alt="">
        <img src="/marketplace/assets/items/img4.png" alt="">
        <img src="/marketplace/assets/items/img5.png" alt="">
        <img src="/marketplace/assets/items/img6.png" alt="">
        <img src="/marketplace/assets/items/img7.png" alt="">
      </div>
      <div class="page-hero-inner">
        <h1>Scopri le opere</h1>
      </div>
    </section>

    <div class="visits-layout">
      <entity-filter-sidebar></entity-filter-sidebar>

      <section class="visits-content" aria-label="Lista opere">
        <div class="type-toggle" id="type-toggle" role="tablist" aria-label="Tipo di opera">
          <button type="button" class="active" role="tab" aria-selected="true" data-type="all">Tutte</button>
          <button type="button" role="tab" aria-selected="false" data-type="true">Fisiche</button>
          <button type="button" role="tab" aria-selected="false" data-type="false">Non fisiche</button>
        </div>

        <div class="results-bar">
          <span class="results-count" id="results-count" aria-live="polite">— opere</span>

          <div class="results-controls">
            <label class="opera-search" aria-label="Cerca tra le opere">
              <input id="search-opera" type="search" placeholder="Cerca un'opera…" autocomplete="off">
            </label>
            <label for="sort">Ordina</label>
            <select id="sort" aria-label="Ordina le opere">
              <option value="name">Nome A→Z</option>
              <option value="-name">Nome Z→A</option>
              <option value="artwork_author">Autore A→Z</option>
              <option value="-artwork_author">Autore Z→A</option>
              <option value="-createdAt">Più recenti</option>
              <option value="+createdAt">Meno recenti</option>
            </select>
          </div>
        </div>

        <div class="opere-grid" id="opere-grid" role="list" aria-label="Opere disponibili"></div>
        <nav class="pagination" id="pagination" aria-label="Navigazione pagine"></nav>
      </section>
    </div>
  </main>

  <app-footer></app-footer>

  <opera-modal></opera-modal>

  <script src="/marketplace/js/hero-slideshow.js"></script>
  <script type="module" src="/marketplace/js/opere.js"></script>
</body>
</html>
