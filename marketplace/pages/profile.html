<!DOCTYPE html>
<html lang="it">
<head>
  <script>(function(){var t=localStorage.getItem('artaround-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtAround — Il tuo profilo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/marketplace/css/base.css">
  <link rel="stylesheet" href="/marketplace/css/visits.css">
  <link rel="stylesheet" href="/marketplace/css/auth.css">
  <link rel="stylesheet" href="/marketplace/css/create-content.css">
  <link rel="stylesheet" href="/marketplace/css/create-item.css">
  <link rel="stylesheet" href="/marketplace/css/profile.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: ['selector', '[data-theme="dark"]'] };</script>

  <script type="module" src="/marketplace/components/app-navbar.js"></script>
  <script type="module" src="/marketplace/components/app-footer.js"></script>
  <script type="module" src="/marketplace/components/visit-card.js"></script>
  <script type="module" src="/marketplace/components/visit-modal.js"></script>
  <script type="module" src="/marketplace/components/item-modal.js"></script>
</head>
<body>

  <app-navbar></app-navbar>

  <main>
    <section class="page-hero" aria-label="Il tuo profilo">
      <div class="page-hero-inner">
        <div class="hero-avatar" id="hero-avatar">
          <img id="hero-avatar-img" src="" alt="" hidden>
          <span id="hero-avatar-initial" aria-hidden="true"></span>
        </div>
        <div class="kicker">Marketplace</div>
        <h1>Il tuo profilo</h1>
        <p class="hero-sub" id="hero-sub">—</p>
      </div>
    </section>

    <div class="profile-layout">
      <nav class="profile-nav static md:sticky md:top-24 md:self-start flex flex-row md:flex-col gap-1.5 md:gap-1 overflow-x-auto md:overflow-visible p-6 pb-0 md:pb-8 md:pt-11 md:pl-12 md:pr-6" aria-label="Sezioni del profilo">
        <button type="button" class="tab-btn text-left rounded-full px-4 py-2.5 md:py-2 text-[0.72rem] font-semibold tracking-[0.08em] uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/20 transition-all duration-300 ease-in-out [&.active]:bg-slate-800 [&.active]:text-white dark:[&.active]:bg-white dark:[&.active]:text-slate-900" data-tab="visite">Visite</button>
        <button type="button" class="tab-btn text-left rounded-full px-4 py-2.5 md:py-2 text-[0.72rem] font-semibold tracking-[0.08em] uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/20 transition-all duration-300 ease-in-out [&.active]:bg-slate-800 [&.active]:text-white dark:[&.active]:bg-white dark:[&.active]:text-slate-900" data-tab="descrizioni">Descrizioni</button>
        <button type="button" class="tab-btn text-left rounded-full px-4 py-2.5 md:py-2 text-[0.72rem] font-semibold tracking-[0.08em] uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/20 transition-all duration-300 ease-in-out [&.active]:bg-slate-800 [&.active]:text-white dark:[&.active]:bg-white dark:[&.active]:text-slate-900" data-tab="vendite">Vendite &amp; acquisti</button>
        <button type="button" class="tab-btn text-left rounded-full px-4 py-2.5 md:py-2 text-[0.72rem] font-semibold tracking-[0.08em] uppercase whitespace-nowrap text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/20 transition-all duration-300 ease-in-out [&.active]:bg-slate-800 [&.active]:text-white dark:[&.active]:bg-white dark:[&.active]:text-slate-900" data-tab="impostazioni">Impostazioni</button>
      </nav>

      <div class="profile-content">

        <!-- ── Visite (create / adottate / preferiti) ── -->
        <section id="panel-visite" class="panel" aria-label="Le tue visite">
          <div class="sub-pills" role="tablist" aria-label="Filtro visite">
            <button type="button" class="pill" data-sub="create">Create</button>
            <button type="button" class="pill" data-sub="adopted">Adottate</button>
            <button type="button" class="pill" data-sub="favorites">Preferiti</button>
          </div>
          <p class="panel-hint" id="visite-hint"></p>
          <div class="visits-grid" id="visite-grid" role="list" aria-label="Visite"></div>
        </section>

        <!-- ── Descrizioni create ── -->
        <section id="panel-descrizioni" class="panel" aria-label="Le tue descrizioni">
          <p class="panel-hint">Le descrizioni (item) che hai creato per le opere del catalogo.</p>
          <div class="desc-grid" id="descrizioni-grid" role="list" aria-label="Descrizioni"></div>
        </section>

        <!-- ── Vendite & acquisti ── -->
        <section id="panel-vendite" class="panel" aria-label="Vendite e acquisti">
          <div class="sub-pills" role="tablist" aria-label="Filtro vendite e acquisti">
            <button type="button" class="pill" data-sub="purchases">Acquisti</button>
            <button type="button" class="pill" data-sub="sales">Vendite</button>
          </div>
          <p class="panel-hint" id="vendite-hint"></p>
          <div class="orders-list" id="vendite-list" role="list" aria-label="Ordini"></div>
        </section>

        <!-- ── Impostazioni ── -->
        <section id="panel-impostazioni" class="panel" aria-label="Impostazioni del profilo">
          <form id="settings-form" class="auth-form profile-form">
            <div class="field">
              <label for="display_name">Nome visualizzato</label>
              <input id="display_name" name="display_name" type="text" maxlength="60" placeholder="Come vuoi essere chiamato/a">
            </div>
            <div class="field">
              <label for="bio">Bio</label>
              <textarea id="bio" name="bio" maxlength="300" rows="3" placeholder="Racconta qualcosa di te"></textarea>
            </div>
            <div class="field">
              <label>Avatar</label>
              <div id="avatar-field"></div>
            </div>
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" minlength="3" maxlength="30" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required>
            </div>

            <div class="field-divider">Cambia password <span>(lascia vuoto per non modificarla)</span></div>

            <div class="field">
              <label for="password">Nuova password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••">
            </div>
            <div class="field">
              <label for="password_confirm">Conferma nuova password</label>
              <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-primary">Salva modifiche</button>
            <p class="feedback" id="settings-feedback"></p>
          </form>
        </section>

      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <visit-modal></visit-modal>
  <item-modal></item-modal>

  <script type="module" src="/marketplace/js/profile.js"></script>
</body>
</html>
