services:
  # 1. MongoDB Container
  mongo_db:
    image: mongo:latest
    container_name: local_mongo
    restart: always
    environment:
      # Allineato con i valori di default scritti nel tuo index.js
      MONGO_INITDB_ROOT_USERNAME: site242555
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}  
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Container (Node 22)
  node_app:
    image: node:22
    container_name: local_node_app
    working_dir: /app/backend
    volumes:
      - ./:/app              # Mappa la tua cartella locale nel container
      - /app/node_modules    # Isola i node_modules nel container
    ports:
      - "8000:8000"          # Espone la porta 8000
    depends_on:
      - mongo_db
    environment:
      # Passiamo le variabili d'ambiente corrette a index.js
      DB_HOST: mongo_db:27017 
      DB_USER: site242555
      DB_PASS: ${DB_PASS}  
    # Installa le dipendenze e avvia index.js
    command: sh -c "npm install && npm run dev"

volumes:
  mongo_data: